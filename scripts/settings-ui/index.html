<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>إعداداتك — Yasar's Reel Studio</title>
  <link rel="stylesheet" href="/fonts.css?token=__TOKEN__" id="font-styles">
  <link rel="stylesheet" href="/app.css?token=__TOKEN__">
  <script type="module" src="/app.js?token=__TOKEN__"></script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="?token=__TOKEN__" aria-label="Yasar's Reel Studio">
        <span class="brand-mark" aria-hidden="true"><i></i></span>
        <span class="brand-name" dir="ltr">Yasar's <b>Reel Studio</b></span>
      </a>
      <span class="who" id="user-label">إعداد الاستوديو</span>
      <span class="local-badge"><span aria-hidden="true"></span><span id="local-label">على جهازك فقط</span></span>
      <span class="edition" id="edition" dir="ltr"></span>
    </header>
    <nav class="rail" aria-label="Steps">
      <div class="rail-track" id="steps"></div>
    </nav>
    <main class="workspace">
      <div class="step-meta"><span id="step-number"></span><span id="save-state">جاهز لاختياراتك</span></div>
      <section id="content" aria-labelledby="page-title"><p>نفتح إعداداتك…</p></section>
      <div id="error" class="error" role="alert" hidden></div>
    </main>
    <footer id="actions" class="actions"></footer>
  </div>
  <noscript>This screen needs JavaScript. Ask the assistant to set your preferences with you in the chat instead. — هذه الشاشة تحتاج JavaScript. اطلب من المساعد ضبط إعداداتك معك في المحادثة.</noscript>
</body>
</html>
